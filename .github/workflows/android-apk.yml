name: EYR · Compilar APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EYR_KEYSTORE_B64: ${{ secrets.EYR_KEYSTORE_B64 }}
      EYR_KEYSTORE_PASSWORD: ${{ secrets.EYR_KEYSTORE_PASSWORD }}
      EYR_KEY_ALIAS: ${{ secrets.EYR_KEY_ALIAS }}
      EYR_KEY_PASSWORD: ${{ secrets.EYR_KEY_PASSWORD }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK disponible
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then echo "No se encontró sdkmanager"; exit 1; fi
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Incluir app local en APK
        run: |
          mkdir -p android/app/src/main/assets/assets
          cp index.html styles.css eyr-theme.css remitos.css calendar-views.css calendar-views.js catalogo.css label-scan.css label-scan.js catalogo-data.js app.js pdf.js remitos-pdf.js logo-data.js manifest.webmanifest sw.js android/app/src/main/assets/
          cp assets/* android/app/src/main/assets/assets/
      - name: Pruebas automáticas de pantallas
        run: node tests/smoke.js
      - name: Compilar APK release
        run: gradle -p android --no-daemon assembleRelease --stacktrace
      - name: Preparar firma permanente, si hay secretos configurados
        if: ${{ env.EYR_KEYSTORE_B64 != '' && env.EYR_KEYSTORE_PASSWORD != '' && env.EYR_KEY_ALIAS != '' && env.EYR_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$EYR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eyr-release.p12"
          chmod 600 "$RUNNER_TEMP/eyr-release.p12"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/eyr-release.p12" --ks-key-alias "$EYR_KEY_ALIAS" --ks-pass env:EYR_KEYSTORE_PASSWORD --key-pass env:EYR_KEY_PASSWORD --out "android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk" "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk"
          # Garantizar que todas las actualizaciones conservan exactamente la misma firma.
          actual_sha256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          expected_sha256=$(tr -d '\r\n ' < android/signing-cert-sha256.txt | tr '[:upper:]' '[:lower:]')
          if [[ -z "$actual_sha256" || "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::Firma distinta de la original EYR. Se bloquea la publicación para proteger las actualizaciones."
            exit 1
          fi
          echo "Firma permanente EYR comprobada."
          rm -f "$RUNNER_TEMP/eyr-release.p12"
      - name: Publicar APK con firma permanente
        if: ${{ env.EYR_KEYSTORE_B64 != '' && env.EYR_KEYSTORE_PASSWORD != '' && env.EYR_KEY_ALIAS != '' && env.EYR_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EYR-Refrigeracion-ESTABLE
          path: android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk
          if-no-files-found: error
          retention-days: 30
      - name: Avisar si falta firma estable
        if: ${{ env.EYR_KEYSTORE_B64 == '' || env.EYR_KEYSTORE_PASSWORD == '' || env.EYR_KEY_ALIAS == '' || env.EYR_KEY_PASSWORD == '' }}
        run: |
          echo "::warning::No se publicó APK: faltan credenciales de firma permanente."
          echo "## No hay APK actualizable" >> "$GITHUB_STEP_SUMMARY"
          echo "La APK de actualización solo se publica con la misma firma de la versión instalada. Configurar los cuatro secretos EYR_KEYSTORE_B64, EYR_KEYSTORE_PASSWORD, EYR_KEY_ALIAS y EYR_KEY_PASSWORD." >> "$GITHUB_STEP_SUMMARY"
