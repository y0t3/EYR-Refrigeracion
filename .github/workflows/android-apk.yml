name: EYR · Compilar APK Android
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EYR_KEYSTORE_B64: ${{ secrets.EYR_KEYSTORE_B64 }}
      EYR_KEYSTORE_PASSWORD: ${{ secrets.EYR_KEYSTORE_PASSWORD }}
      EYR_KEY_ALIAS: ${{ secrets.EYR_KEY_ALIAS }}
      EYR_KEY_PASSWORD: ${{ secrets.EYR_KEY_PASSWORD }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK disponible
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [[ -z "$SDKMANAGER" ]]; then echo "No se encontró sdkmanager"; exit 1; fi
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Incluir app local en APK
        run: |
          mkdir -p android/app/src/main/assets/assets
          cp index.html styles.css eyr-theme.css remitos.css calendar-views.css calendar-views.js app.js pdf.js remitos-pdf.js logo-data.js manifest.webmanifest sw.js android/app/src/main/assets/
          cp assets/* android/app/src/main/assets/assets/
      - name: Compilar APK de prueba y versión sin firmar
        run: gradle -p android --no-daemon assembleDebug assembleRelease --stacktrace
      - name: Preparar firma permanente, si hay secretos configurados
        if: ${{ env.EYR_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$EYR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/eyr-release.p12"
          chmod 600 "$RUNNER_TEMP/eyr-release.p12"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/eyr-release.p12" --ks-key-alias "$EYR_KEY_ALIAS" --ks-pass env:EYR_KEYSTORE_PASSWORD --key-pass env:EYR_KEY_PASSWORD --out "android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk" "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk"
          rm -f "$RUNNER_TEMP/eyr-release.p12"
      - name: Publicar APK con firma permanente
        if: ${{ env.EYR_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EYR-Refrigeracion-ESTABLE
          path: android/app/build/outputs/apk/release/EYR-Refrigeracion-Estable.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK sin firmar para su firma privada
        if: ${{ env.EYR_KEYSTORE_B64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EYR-Release-SIN-FIRMA-No-Instalar
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Herramientas oficiales Android para firma privada
        if: ${{ env.EYR_KEYSTORE_B64 == '' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eyr-apksigner/lib"
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" "$RUNNER_TEMP/eyr-apksigner/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/eyr-apksigner/lib/"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$RUNNER_TEMP/eyr-apksigner/"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/eyr-apksigner-tools.zip" eyr-apksigner
      - name: Exportar herramientas oficiales
        if: ${{ env.EYR_KEYSTORE_B64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-Tools-Para-Firma-Privada
          path: eyr-apksigner-tools.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: EYR-APK-PRUEBA-FIRMA-TEMPORAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30