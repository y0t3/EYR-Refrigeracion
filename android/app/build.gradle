plugins { id 'com.android.application' }
android {
    namespace 'com.eyr.refrigeracion'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eyr.refrigeracion'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '2.7'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Modelo OCR latino integrado: funciona sin datos móviles ni descargar modelos.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // FileProvider para fotos temporales en alta resolución sin guardar en galería.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // QR integrados y lectura local sin descargar modelos.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}

/* ML Kit 16.0.1 y AndroidX pueden traer distintas versiones de kotlin-stdlib.
   Unificar las variantes jdk7/jdk8 evita Duplicate class en Gradle 8. */
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
            details.because 'Unificar Kotlin stdlib de OCR y AndroidX para Android'
        }
    }
}
